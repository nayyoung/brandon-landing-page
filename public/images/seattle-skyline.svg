<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#c27c4b;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#a65d35;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#skyGradient)"/>
  <!-- Seattle Skyline Silhouette -->
  <g fill="#0a0a0a">
    <!-- Space Needle -->
    <path d="M400,600 L400,400 L395,400 L390,380 L410,380 L405,400 L405,600 Z"/>
    <ellipse cx="400" cy="380" rx="30" ry="8"/>
    <rect x="397" y="350" width="6" height="30"/>
    <ellipse cx="400" cy="350" rx="15" ry="5"/>
    <!-- Downtown buildings -->
    <rect x="480" y="450" width="40" height="150"/>
    <rect x="530" y="400" width="50" height="200"/>
    <rect x="590" y="420" width="35" height="180"/>
    <rect x="635" y="380" width="60" height="220"/>
    <rect x="705" y="430" width="45" height="170"/>
    <rect x="760" y="460" width="55" height="140"/>
    <rect x="200" y="500" width="30" height="100"/>
    <rect x="240" y="480" width="40" height="120"/>
    <rect x="290" y="520" width="35" height="80"/>
    <!-- Water reflection area -->
    <rect x="0" y="600" width="1200" height="200" fill="#0a0a0a" opacity="0.8"/>
  </g>
  <!-- Subtle stars -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="100" cy="80" r="1"/>
    <circle cx="250" cy="120" r="1.5"/>
    <circle cx="450" cy="60" r="1"/>
    <circle cx="700" cy="100" r="1.2"/>
    <circle cx="900" cy="70" r="1"/>
    <circle cx="1050" cy="130" r="1.3"/>
  </g>
</svg>
