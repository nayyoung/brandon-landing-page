<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="skyGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2a2a4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="needleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3a3a3a"/>
      <stop offset="50%" style="stop-color:#5a5a5a"/>
      <stop offset="100%" style="stop-color:#3a3a3a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#skyGradient2)"/>
  
  <!-- Space Needle - Detailed -->
  <g transform="translate(400, 100)">
    <!-- Top antenna -->
    <rect x="-3" y="0" width="6" height="80" fill="url(#needleGradient)"/>
    <!-- Top disc -->
    <ellipse cx="0" cy="80" rx="8" ry="3" fill="#4a4a4a"/>
    <!-- Upper tower section -->
    <rect x="-4" y="80" width="8" height="120" fill="url(#needleGradient)"/>
    <!-- Observation deck -->
    <ellipse cx="0" cy="200" rx="100" ry="25" fill="#3a3a3a"/>
    <ellipse cx="0" cy="195" rx="95" ry="20" fill="#5a5a5a"/>
    <ellipse cx="0" cy="190" rx="90" ry="18" fill="#4a4a4a"/>
    <!-- Windows on observation deck -->
    <g fill="#c27c4b" opacity="0.6">
      <rect x="-80" y="188" width="15" height="8" rx="1"/>
      <rect x="-55" y="188" width="15" height="8" rx="1"/>
      <rect x="-30" y="188" width="15" height="8" rx="1"/>
      <rect x="-5" y="188" width="15" height="8" rx="1"/>
      <rect x="20" y="188" width="15" height="8" rx="1"/>
      <rect x="45" y="188" width="15" height="8" rx="1"/>
      <rect x="70" y="188" width="15" height="8" rx="1"/>
    </g>
    <!-- Lower structure -->
    <polygon points="-80,225 80,225 20,700 -20,700" fill="url(#needleGradient)"/>
    <!-- Support struts -->
    <line x1="-60" y1="225" x2="-15" y2="700" stroke="#2a2a2a" stroke-width="4"/>
    <line x1="60" y1="225" x2="15" y2="700" stroke="#2a2a2a" stroke-width="4"/>
    <!-- Base platform -->
    <ellipse cx="0" cy="700" rx="60" ry="15" fill="#2a2a2a"/>
  </g>
  
  <!-- Background buildings silhouette -->
  <g fill="#1a1a1a" opacity="0.5">
    <rect x="100" y="650" width="60" height="350"/>
    <rect x="180" y="700" width="45" height="300"/>
    <rect x="600" y="680" width="50" height="320"/>
    <rect x="670" y="720" width="55" height="280"/>
  </g>
  
  <!-- Subtle copper accent glow -->
  <ellipse cx="400" cy="300" rx="200" ry="100" fill="#c27c4b" opacity="0.1" filter="blur(50px)"/>
</svg>
